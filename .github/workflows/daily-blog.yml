name: Daily blog generation

on:
  schedule:
    # 08:00 UTC every day
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Blog generator only uses Node builtins + local TS — no project install needed.
      # Avoids npm ci lockfile failures blocking daily posts.
      - name: Generate blog post with DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ''
          GITHUB_REPO: ''
        run: npx --yes tsx scripts/generate-daily-blog.ts

      - name: Commit generated post
        run: |
          git config user.name "rizzassist-bot"
          git config user.email "bot@rizzassistgo.com"
          git add data/blog/generated.json
          if git diff --staged --quiet; then
            echo "No new blog post to commit."
          else
            git commit -m "chore(blog): add daily automated post"
            git push
          fi
